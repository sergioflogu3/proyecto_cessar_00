services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sistickets-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/sql/entrypoint.sh:/usr/local/bin/entrypoint.sh
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuPassword123!' -C -Q \"SELECT 1 FROM sys.databases WHERE name = 'SISTickets'\" > /dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TuPassword123!' -C -Q \"SELECT 1 FROM sys.databases WHERE name = 'SISTickets'\" > /dev/null 2>&1) || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 45s
    networks:
      - sistickets-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: sistickets-azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --silent"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    networks:
      - sistickets-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistickets-app
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    # Publicado en localhost (127.0.0.1) por defecto — host y puerto parametrizables en .env
    # (APP_HOST / APP_PORT, ver .env.example). Docker exige una IP real en el bind, "localhost"
    # como string no es válido ahí; 127.0.0.1 es lo que resuelve "http://localhost:<puerto>".
    # Nota (A3): esto solo sostiene el login porque ASPNETCORE_ENVIRONMENT=Development hace que
    # la cookie "jwt" no exija HTTPS (Secure=false). Fuera de Development sigue exigiendo HTTPS
    # siempre — para eso está el servicio "caddy" (ver más abajo).
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SISTickets;User Id=sa;Password=TuPassword123!;TrustServerCertificate=True;"
      # JWT_KEY debe venir de un archivo .env local (no versionado) o del entorno del host.
      # Ver .env.example. La app rechaza arrancar si esta clave falta, es corta o es un placeholder.
      Jwt__Key: "${JWT_KEY:?Define JWT_KEY en un archivo .env (copia .env.example) antes de levantar el stack}"
      Jwt__Issuer: "SistemaTickets"
      Jwt__Audience: "SistemaTicketsUsers"
      Jwt__ExpireMinutes: "30"
      Encryption__Key: "TU-CLAVE-AES-256-DE-AL-MENOS-32-CARACTERES"
      AzureBlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AzureBlobStorage__ContainerName: "sistema"
    networks:
      - sistickets-network

  # A3: reverse proxy que termina TLS con un certificado autofirmado local (Caddy lo genera
  # solo). Es el único servicio publicado al host — accedé a la app por
  # https://localhost:8443 (el navegador va a advertir que el certificado no es de una CA
  # pública; es esperado en este setup local).
  caddy:
    image: caddy:2-alpine
    container_name: sistickets-proxy
    depends_on:
      - app
    ports:
      - "8443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - sistickets-network

volumes:
  sqlserver_data:
  azurite_data:
  caddy_data:

networks:
  sistickets-network:
    driver: bridge
